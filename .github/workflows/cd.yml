name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Test Network Connectivity
      run: |
        echo "Testing network connectivity to ${{ secrets.EC2_HOST }}..."
        timeout 10 nc -zv ${{ secrets.EC2_HOST }} 22 || echo "SSH port 22 is not reachable"
        ping -c 3 ${{ secrets.EC2_HOST }} || echo "Host is not reachable"
        echo "If both fail, check EC2 security group and public IP"

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        timeout: 60s
        command_timeout: 300s
        script: |
          # Detect OS and install packages (non-failing)
          if command -v apt &> /dev/null; then
            # Ubuntu/Debian
            sudo apt update || true
            sudo apt install -y docker.io docker-compose git || true
            sudo usermod -aG docker $USER || true
            sudo systemctl enable docker || true
            sudo systemctl start docker || true
          elif command -v yum &> /dev/null; then
            # Amazon Linux/CentOS
            sudo yum update -y || true
            sudo yum install -y docker git || true
            sudo systemctl enable docker || true
            sudo systemctl start docker || true
            sudo usermod -a -G docker $USER || true
            # Install docker-compose if missing
            if ! command -v docker-compose &> /dev/null; then
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose || true
              sudo chmod +x /usr/local/bin/docker-compose || true
            fi
          fi
          
          # Create app directory if it doesn't exist
          mkdir -p /home/${{ secrets.EC2_USERNAME }}/app
          cd /home/${{ secrets.EC2_USERNAME }}/app
          
          # Clone or update repository (using GitHub token for private repo)
          if [ ! -d ".git" ]; then
            echo "Cloning repository for first time..."
            git clone https://${{ secrets.GITHUB_TOKEN }}@github.com/Areejsherazi/Media-share.git .
          else
            echo "Repository exists, pulling latest changes..."
            git pull origin main
          fi
          
          # Deploy using docker-compose if available
          if command -v docker-compose &> /dev/null; then
            echo "Deploying with docker-compose..."
            docker-compose down || true
            docker-compose up -d --build || true
            sleep 10
            docker-compose ps || true
          elif docker compose version &> /dev/null; then
            echo "Deploying with docker compose (v2)..."
            docker compose down || true
            docker compose up -d --build || true
            sleep 10
            docker compose ps || true
          else
            echo "Warning: docker-compose not found. Skipping container deployment."
            echo "You may need to log out and log back in for docker group changes to take effect,"
            echo "or install docker-compose manually."
          fi
